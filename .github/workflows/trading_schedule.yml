name: Hourly Gold Trading Engine

on:
  schedule:
    # Triggers at minute 0 of every hour (00:00, 01:00, etc.)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI for testing

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pandas_ta xgboost scikit-learn requests

      - name: Run AI Inference & Execute Trade
        env:
          WEBHOOK_URL: "https://my-trading-son.onrender.com/webhook"
        run: |
          python ai_brain.py