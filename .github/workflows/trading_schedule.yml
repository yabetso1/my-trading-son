name: Hourly Gold Trading Engine

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Upgraded to Python 3.12 to satisfy modern package requirements
      - name: Set up Python 3.12
        uses: actions/setup-python@v5 

        
        with:
          python-version: '3.12'

      

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas<2.2.0" yfinance xgboost scikit-learn requests
          pip install pandas-ta

      - name: Run AI Inference & Execute Trade
        env:
          WEBHOOK_URL: "https://dash-for-bot.onrender.com/webhook"
        run: |
          python ai_brain.py
